<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="header">
    <div class="header__inner">
        <a class="logo" href="/">Маркет</a>
        <nav class="nav">
            <a href="/create">Создать товар</a>
            <a class="nav__primary" href="/login">Войти</a>
        </nav>
    </div>
</header>
    <main class="auth">
        <section class="panel">
            <h1>Вход</h1>
            <p class="panel__lead">Войдите, чтобы создавать товары.</p>
            <form class="form" id="form">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Пароль</label>
                    <input id="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn" id="btn">Войти</button>
            </form>
            <p class="note">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
        </section>
    </main>
    <script src="/header.js" defer></script>
    <script src="/login.js" defer></script>
</body>
</html>
