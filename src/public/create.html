<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создать товар</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="header">
    <div class="header__inner">
        <a class="logo" href="/">Маркет</a>
        <nav class="nav">
            <a href="/create">Создать товар</a>
            <a class="nav__primary" href="/login">Войти</a>
        </nav>
    </div>
</header>
    <main class="auth">
        <section class="panel panel--wide">
            <h1>Новый товар</h1>
            <p class="panel__lead">Он сразу появится на главной.</p>
            <form class="form" id="form">
                <div class="field">
                    <label for="name">Название</label>
                    <input id="name" required>
                </div>
                <div class="row">
                    <div class="field">
                        <label for="price">Цена, ₽</label>
                        <input id="price" type="number" step="0.01" min="0" required>
                    </div>
                    <div class="field">
                        <label for="category_id">ID категории</label>
                        <input id="category_id" type="number" min="1" required>
                    </div>
                </div>
                <div class="field">
                    <label for="description">Описание</label>
                    <textarea id="description"></textarea>
                </div>
                <button class="btn" id="btn">Создать товар</button>
            </form>
        </section>
    </main>
    <script src="/header.js" defer></script>
    <script src="/create.js" defer></script>
</body>
</html>
